# Builds Storybook for every pull request and publishes it to GitHub Pages at
# https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# A sticky comment on the PR links to the preview. Closing the PR removes it.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a branch",
# branch "gh-pages", folder "/ (root)". The branch is created by the first deploy.
name: Storybook preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  build:
    # Skip fork PRs: their token can't push to gh-pages. Skip closed PRs: nothing to build.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: storybook-preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build-storybook -- --output-dir storybook-static
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

  deploy:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Per PR, so a newer push replaces a queued older deploy. Concurrent pushes to gh-pages from
    # other PRs or main are retried by the deploy action (force: false rebases and tries again).
    concurrency:
      group: storybook-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # sticky preview comment
    steps:
      # The deploy actions push from a git checkout; no PR code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static

      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: storybook-static
          action: deploy

  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: storybook-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The deploy actions push from a git checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
